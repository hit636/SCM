name: Validation
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_repository.py
      - run: python scripts/check_docs.py
      - run: python scripts/check_device.py --device cpu
      - run: bash -n scripts/run_api.sh
      - run: bash scripts/run_api.sh --out runs/ci_api
      - run: python -m black --check fame_scm scripts tests run.py example_api.py
      - run: python scripts/test.py
      - run: python run.py demo --config configs/experiments/quick_demo.yaml --out runs/ci_demo --series 12 --days 420 --methods lightgbm full_observation scm_passive fame_scm_active
      - run: python run.py audit --out runs/ci_demo
      - run: python -m build
